<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESAPEGO</title>
    <link rel="stylesheet" href="styleCad.css">
</head>

<body>
    <section class="container-login">
        <header>
            <div class="logo">
                <a href="#" class="logo-link">
                    <img src="/img/logo_menor.png" alt="Logo do site" class="logo-image">
                </a>
            </div>
        </header>
        <main>
            <article class="intro">
                <p>Olá, Desapeger
                    <br>
                    Para circular seu produto, responda os campos abaixo.
                    <br>Partiu desapegar! ;)
                </p>
            </article>
            <hr>
            <form action="" name="cad-user" method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome">
                </div>

                <div class="form-group">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf">
                </div>

                <div class="form-group">
                    <label for="titulo">Título:</label>
                    <input type="text" id="titulo" name="titulo">
                </div>
                <div class="form-group">
                    <label for="categoria">Categoria:</label>
                    <select id="categoria" name="categoria">
                        <option value="" disabled selected>Selecione uma categoria</option>
                        <option value="food"> Alimentos</option>
                        <option value="clothes"> Roupas</option>
                        <option value="electronics"> Eletrônicos</option>
                        <option value="books"> Livros</option>
                        <option value="furniture"> Móveis</option>
                        <option value="others"> Outros</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="distancia">Distância máxima para retirada (km):</label>
                    <input type="number" id="distancia" name="distancia" min="1" max="100" value="10">
                </div>
                <label for="descricao">Descrição do produto:</label>
                <input type="text" id="descricao" name="descricao">
                <div class="endereco">
                    <div class="form-group">
                        <label for="rua">Rua:</label>
                        <input type="text" id="rua" name="rua">
                    </div>
                    <div class="group-number">
                        <label for="numero">Número:</label>
                        <input type="text" id="numero" name="numero">
                    </div>

                    <div class="form-group">
                        <label for="bairro">Bairro:</label>
                        <input type="text" id="bairro" name="bairro">
                    </div>

                    <div class="group-number">
                        <label for="cep">CEP:</label>
                        <input type="text" id="cep" name="cep">
                    </div>

                    <div class="form-group">
                        <label for="complem">Complemento:</label>
                        <input type="text" id="complemento" name="complem">
                    </div>

                    <div class="form-group">
                        <label for="cidade">Cidade:</label>
                        <input type="text" id="cidade" name="cidade">
                    </div>

                    <div class="form-group">
                        <label>Estado:</label>
                        <select id="estado" name="estado" class="grid-estados">
                            <option value="" disabled selected>Selecione seu estado</option>
                            <option id="ac" value="AC">AC</option>
                            <option id="al" value="AL">AL</option>
                            <option id="ap" value="AP">AP</option>
                            <option id="am" value="AM">AM</option>
                            <option id="ba" value="BA">BA</option>
                            <option id="ce" value="CE">CE</option>
                            <option id="df" value="DF">DF</option>
                            <option id="es" value="ES">ES</option>
                            <option id="go" value="GO">GO</option>
                            <option id="ma" value="MA">MA</option>
                            <option id="mt" value="MT">MT</option>
                            <option id="ms" value="MS">MS</option>
                            <option id="mg" value="MG">MG</option>
                            <option id="pa" value="PA">PA</option>
                            <option id="pb" value="PB">PB</option>
                            <option id="pr" value="PR">PR</option>
                            <option id="pe" value="PE">PE</option>
                            <option id="pi" value="PI">PI</option>
                            <option id="rj" value="RJ">RJ</option>
                            <option id="rn" value="RN">RN</option>
                            <option id="rs" value="RS">RS</option>
                            <option id="ro" value="RO">RO</option>
                            <option id="rr" value="RR">RR</option>
                            <option id="sc" value="SC">SC</option>
                            <option id="sp" value="SP">SP</option>
                            <option id="se" value="SE">SE</option>
                            <option id="to" value="TO">TO</option>
                        </select>
                    </div>
                </div>
                <fieldset>
                    <legend>Adicione até 3 imagens do produto</legend>
                    <div id="preview-container">
                        <label for="foto1" class="upload-label">
                            <span class="icon-img">🖼️</span>
                            <input type="file" id="foto1" name="foto" accept="image/*" class="input-file">
                            <img id="img-prev-1" src="#" alt="Image Preview" class="hidden">
                        </label>
                        <label for="foto2" class="upload-label">
                            <span class="icon-img">🖼️</span>
                            <input type="file" id="foto2" name="foto" accept="image/*" class="input-file">
                            <img id="img-prev-2" src="#" alt="Image Preview" class="hidden">
                        </label>
                        <label for="foto3" class="upload-label">
                            <span class="icon-img">🖼️</span>
                            <input type="file" id="foto3" name="foto" accept="image/*" class="input-file">
                            <img id="img-prev-3" src="#" alt="Image Preview" class="hidden">
                        </label>
                    </div>
                </fieldset>
                <div class="form-actions">
                    <a href="index.html">
                        <button type="button" id="voltar" class="btn" value="Voltar">Voltar</button>
                    </a> <input type="submit" id="cadProd" class="btn" value="Cadastrar">
                </div>
            </form>
            <div id="alerta">
                <p id="alertaNome"></p>
                <p id="alertaCpf"></p>
                <p id="alertaTitulo"></p>
                <p id="alertaDescricao"></p>
                <p id="alertaEndereco"></p>
                <p id="alertaCEP"></p>
                <p id="alertaFotos"></p>
                <p id="sucesso"></p>
                <p id="msgVoltar"></p>
            </div>
        </main>
        <footer class="footer">
            <p class="left-footer">&copy; 2026 DESAPEGO - Todos os direitos reservados
            </p>
        </footer>
    </section>
    <script src="api-config.js"></script>
    <script src="scriptCAD.js"></script>
</body>
