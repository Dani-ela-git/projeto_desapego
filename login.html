<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESAPEGO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="container-login">
        <header>
            <div class="logo">
                    <a href="#" class="logo-link">
                        <img src="img/logosemfundo350px.png" alt="Logo do site" class="logo-image">
                    </a>
            </div>
            <nav>
                <button>
                    <a href="">Voltar</a>
                </button>
            </nav>
        </header>
        <article class="intro">
            <p>Olá, Desapeger</p>
            <p>Digite abaixo a sua identificação: </p>
        </article>
        <form action="" name="login">
            <div class="form-group">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf">
            </div>
           <div class="form-actions">
                <input type="submit" id="entrar" value="Login">
            </div>
        </form>
         <div id="alerta">
            <p id="alertaCpf"></p>
            <p id="sucesso"></p>
        </div>
         <footer class="footer">
                <p class="left-footer">&copy; 2026 DESAPEGO - Todos os direitos reservados 
                </p>
            </footer>
    </section>
</body>
