<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESAPEGO</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="container-login">
        <header>
            <div class="logo">
                <a href="#" class="logo-link">
                    <img src="img/logosemfundo350px.png" alt="Logo do site" class="logo-image">
                </a>
            </div>
            <nav>
                <button>
                    <a href="">Voltar</a>
                </button>
            </nav>
        </header>
        <article class="intro">
            <p>Olá, Desapeger</p>
            <p>Para circular seu produto, responda os campos abaixo.
                Partiu desapegar! ;) </p>
        </article>
        <form action="" name="cad-user">
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome">
            </div>

            <div class="form-group">
                <label for="titulo">Título:</label>
                <input type="text" id="titulo" name="titulo">
            </div>

            <div class="form-group">
                <label for="desricao">Descrição do produto:</label>
                <input type="text" id="descricao" name="descricao">
            </div>

            <hr>
            <div class="endereco">
                <div class="form-group">
                    <label for="rua">Rua:</label>
                    <input type="text" id="rua" name="rua">
                </div>

                <div class="form-group">
                    <label for="bairro">Bairro:</label>
                    <input type="text" id="bairro" name="bairro">
                </div>

                <div class="form-group">
                    <label for="numero">Número:</label>
                    <input type="text" id="numero" name="numero">
                </div>

                <div class="form-group">
                    <label for="complem">Complemento:</label>
                    <input type="text" id="complem" name="complem">
                </div>

                <div class="form-group">
                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade">
                </div>

                <div class="form-group">
                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep">
                </div>

                <fieldset>
                    <legend>Estado:</legend>
                    <div class="grid-estados">
                        <div><input type="radio" id="ac" name="estado" value="AC" checked><label for="ac">AC</label>
                        </div>
                        <div><input type="radio" id="al" name="estado" value="AL"><label for="al">AL</label></div>
                        <div><input type="radio" id="ap" name="estado" value="AP"><label for="ap">AP</label></div>
                        <div><input type="radio" id="am" name="estado" value="AM"><label for="am">AM</label></div>
                        <div><input type="radio" id="ba" name="estado" value="BA"><label for="ba">BA</label></div>
                        <div><input type="radio" id="ce" name="estado" value="CE"><label for="ce">CE</label></div>
                        <div><input type="radio" id="df" name="estado" value="DF"><label for="df">DF</label></div>
                        <div><input type="radio" id="es" name="estado" value="ES"><label for="es">ES</label></div>
                        <div><input type="radio" id="go" name="estado" value="GO"><label for="go">GO</label></div>
                        <div><input type="radio" id="ma" name="estado" value="MA"><label for="ma">MA</label></div>
                        <div><input type="radio" id="mt" name="estado" value="MT"><label for="mt">MT</label></div>
                        <div><input type="radio" id="ms" name="estado" value="MS"><label for="ms">MS</label></div>
                        <div><input type="radio" id="mg" name="estado" value="MG"><label for="mg">MG</label></div>
                        <div><input type="radio" id="pa" name="estado" value="PA"><label for="pa">PA</label></div>
                        <div><input type="radio" id="pb" name="estado" value="PB"><label for="pb">PB</label></div>
                        <div><input type="radio" id="pr" name="estado" value="PR"><label for="pr">PR</label></div>
                        <div><input type="radio" id="pe" name="estado" value="PE"><label for="pe">PE</label></div>
                        <div><input type="radio" id="pi" name="estado" value="PI"><label for="pi">PI</label></div>
                        <div><input type="radio" id="rj" name="estado" value="RJ"><label for="rj">RJ</label></div>
                        <div><input type="radio" id="rn" name="estado" value="RN"><label for="rn">RN</label></div>
                        <div><input type="radio" id="rs" name="estado" value="RS"><label for="rs">RS</label></div>
                        <div><input type="radio" id="ro" name="estado" value="RO"><label for="ro">RO</label></div>
                        <div><input type="radio" id="rr" name="estado" value="RR"><label for="rr">RR</label></div>
                        <div><input type="radio" id="sc" name="estado" value="SC"><label for="sc">SC</label></div>
                        <div><input type="radio" id="sp" name="estado" value="SP"><label for="sp">SP</label></div>
                        <div><input type="radio" id="se" name="estado" value="SE"><label for="se">SE</label></div>
                        <div><input type="radio" id="to" name="estado" value="TO"><label for="to">TO</label></div>
                    </div>
                </fieldset>
                <fieldset class="container-image">
                    <legend>Adicione até 3 imagens do produto</legend>
                    <div id="previewContainer">
                        <input type="image" id="imageInput" accept="image/*">
                        <img id="imagePreview" src="#" alt="Image Preview">
                    </div>
                    <div id="previewContainer">
                        <input type="image" id="imageInput" accept="image/*">
                        <img id="imagePreview" src="#" alt="Image Preview">
                    </div>
                    <div id="previewContainer">
                        <input type="image" id="imageInput" accept="image/*">
                        <img id="imagePreview" src="#" alt="Image Preview">
                    </div>

                </fieldset>
                <div class="form-actions">
                    <input type="submit" id="entrar" value="Cadastrar">
                </div>
        </form>
        <div id="alerta">
            <p id="alertaNome"></p>
            <p id="alertaIdade"></p>
            <p id="alertaEndereco"></p>
            <p id="alertaCpf"></p>
            <p id="sucesso"></p>
        </div>
        <footer class="footer">
            <p class="left-footer">&copy; 2026 DESAPEGO - Todos os direitos reservados
            </p>
        </footer>
    </section>
</body>
